name: Deploy MkDocs Site

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/mkdocs-pages.yml'
      - 'docs/**'
      - 'gabriel/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep PR validation runs from cancelling an in-progress production Pages deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt
      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site
      - name: Check whether GitHub Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(curl --silent --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/pages")
          if [ "$status" = "200" ]; then
            build_type=$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("/tmp/pages.json").read_text(encoding="utf-8")).get("build_type", ""))')
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages for ${GH_REPO} uses build_type='${build_type:-unknown}', not 'workflow'; skipping deployment after the strict MkDocs build. Set Pages source to GitHub Actions to publish this artifact." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for ${GH_REPO}; skipping deployment after the strict MkDocs build. Enable Pages with GitHub Actions as the source to publish this artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/pages.json
            exit 1
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
